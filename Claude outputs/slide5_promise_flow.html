   "What we promised in September", animated.
   Same stage, colors and type as the /present deck (BRAND_GUIDELINES.md):

   Light Blue #e7f0f5; 30% tints for the box fills. Sizes in cqw.
   Replay: press R or click the diagram.
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #f6f7f8; }
.present { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: Roboto, Arial, sans-serif; color: #1d2d5c; }
.present__stage { position: relative; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw);
  background: #fff; overflow: hidden; container-type: size; }
.present__c { position: absolute; top: -9cqw; right: -9.5cqw; width: 26cqw; height: 26cqw; opacity: 1; }
.present__body { position: absolute; inset: 0; padding: 2.7cqw 3.75cqw 0; }
.present__eyebrow { margin: 0 0 0.5cqw; font-weight: 700; font-size: 1.2cqw; letter-spacing: 0.12em; color: #07649d; text-transform: uppercase; }
.present__title { margin: 0 0 0.5cqw; font-family: "Roboto Slab", Georgia, serif; font-weight: 300; font-size: 3.3cqw; line-height: 1.12; color: #1d2d5c; }
.present__lead { margin: 0; font-weight: 300; font-size: 1.45cqw; line-height: 1.4; color: #323e48; }
.flow { position: absolute; left: 0; right: 0; top: 11.2cqw; width: 100cqw; height: auto; display: block; cursor: pointer; }
.flow text { font-family: Roboto, Arial, sans-serif; }
.present__band { position: absolute; left: 3.75cqw; right: 3.75cqw; bottom: 1.5cqw; height: 3.4cqw; display: flex; align-items: center; justify-content: center;
  background: #e7f0f5; font-weight: 300; font-size: 1.3cqw; color: #1d2d5c; white-space: pre; }
.present__band b { font-weight: 700; letter-spacing: 0.04em; }

/* boxes rise in one after another, as the deck's own diagram does */
.node { animation: rise 0.4s ease-out both; animation-delay: calc(var(--n, 0) * 110ms + 150ms); transform-box: fill-box; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* the glow on whichever part the dot is in */
.halo { fill: none; stroke: #00a4e4; stroke-width: 4; opacity: 0; transition: opacity 0.25s; }
.halo-c { fill: #00a4e4; opacity: 0; transition: opacity 0.25s; }
.node.on .halo { opacity: 0.85; }
.node.on .halo-c { opacity: 0.16; }

#dot-ring { transform-box: fill-box; transform-origin: center; animation: ring 1.4s ease-in-out infinite; }
@keyframes ring { 0%, 100% { transform: scale(0.9); opacity: .3; } 50% { transform: scale(1.35); opacity: .12; } }
#cap { transition: opacity 0.35s; }
#pips circle { fill: #d9dee3; transition: fill 0.3s; }
#pips circle.on { fill: #07649d; }

@media (prefers-reduced-motion: reduce) {
  .node { animation: none; }
  #dot-ring { animation: none; }
}
</style>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("flow");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SPEED = 320;                       // diagram units per second
  var BLUE = "#00a4e4", GREEN = "#6cb33f";
  var dot = document.getElementById("dot"), dot2 = document.getElementById("dot2");
  var cap = document.getElementById("cap"), pips = document.querySelectorAll("#pips circle");
  var token = 0;

  // number the boxes so they come in one after another
  var order = ["leader","front","access","trans","input","search","out","ticket","team","cyl","ai","rag"];
  order.forEach(function (id, i) { var n = document.getElementById("n-" + id); if (n) n.style.setProperty("--n", i); });

  // ---- the three runs -------------------------------------------------
  // step: { d: path, hit: part to light on arrival, dwell: ms, a: becomes the answer, par: second dot's path }
  // The dot rests on the EDGE of each part, so it never covers the words.
  var HEAD = [{ d: "M94 300H118", hit: "front", dwell: 500 }];
  // English question: sign-in (Access control) only. Translation is a side path.
  var EN = [
    { d: "M118 300H272V362H300", hit: "access", dwell: 700 },
    { d: "M300 362H454V300", pass: true },
    { d: "M454 300H482", hit: "input", dwell: 700 },
    { d: "M482 300H646", hit: "search", dwell: 650 }
  ];
  // Another language: the side path through Translation.
  var TR = [
    { d: "M118 300H272V238H300", hit: "trans", dwell: 800 },
    { d: "M300 238H454V300", pass: true },
    { d: "M454 300H482", hit: "input", dwell: 700 },
    { d: "M482 300H646", hit: "search", dwell: 650 }
  ];
  var BACK = [   // English: the answer goes straight back to Front end, Translation stays dark
    { d: "M873 268V196H210V268", hit: "front", dwell: 350 },
    { d: "M210 268V300H118H94", hit: "leader", dwell: 1500 }
  ];
  var BACK_TR = [   // other language: the answer is translated back
    { d: "M873 268V196H363V210", hit: "trans", dwell: 700 },
    { d: "M363 210V238H272V300H118", hit: "front", dwell: 350 },
    { d: "M118 300H94", hit: "leader", dwell: 1500 }
  ];
  var RUNS = [
    { k: "A QUESTION, SEARCH FIRST",
      lines: ["Check 1 reads the question.", "Search finds ISACA's own words.", "Check 2 reads the answer."],
      steps: HEAD.concat(EN, [
        { d: "M646 300H709V512", hit: "cyl", dwell: 700, a: true },
        { d: "M709 512V300H873V268", hit: "out", dwell: 850 }
      ], BACK) },
    { k: "WHEN SEARCH ISN'T ENOUGH",
      lines: ["The AI writes only from the", "passages found, then Check 2", "reads every sentence."],
      steps: HEAD.concat(EN, [
        { d: "M646 300H873V268", hit: "out", dwell: 350 },
        { d: "M873 268V424", hit: "ai", dwell: 450 },
        { d: "M873 424V520", hit: "rag", dwell: 400 },
        { d: "M873 520V552H772", hit: "cyl", dwell: 700 },
        { d: "M772 552H873V488", hit: "ai", dwell: 850, a: true },
        { d: "M873 488V268", hit: "out", dwell: 850 }
      ], BACK) },
    { k: "NOT IN ENGLISH?",
      lines: ["A side path for other languages:", "Translation reads the question", "in and the answer back out."],
      steps: HEAD.concat(TR, [
        { d: "M646 300H709V512", hit: "cyl", dwell: 700, a: true },
        { d: "M709 512V300H873V268", hit: "out", dwell: 850 }
      ], BACK_TR) },
    { k: "TALK TO A PERSON",
      lines: ["One click, from any screen.", "The question and history", "go with it to your team."],
      steps: HEAD.concat([
        { d: "M118 300H148V172H1049.6V268", hit: "ticket", dwell: 800 },
        { d: "M1049.6 268V300H1140", hit: "team", dwell: 1700, a: true }
      ]) }
  ];

  function pathEl(d) { var p = document.createElementNS(NS, "path"); p.setAttribute("d", d); return p; }
  function setNode(id, on) { var n = document.getElementById("n-" + id); if (n) n.classList.toggle("on", on); }
  function clearNodes() { document.querySelectorAll(".node.on").forEach(function (n) { n.classList.remove("on"); }); }
  function place(g, p, len) { var pt = p.getPointAtLength(len); g.setAttribute("transform", "translate(" + pt.x + "," + pt.y + ")"); }
  function setState(isAnswer) {
    var col = isAnswer ? GREEN : BLUE, ch = isAnswer ? "✓" : "?";
    document.getElementById("dot-c").setAttribute("fill", col);
    document.getElementById("dot-ring").setAttribute("fill", col);
    document.getElementById("dot-t").textContent = ch;
  }
  function wait(ms, my) { return new Promise(function (res) { setTimeout(function () { res(my === token); }, ms); }); }
  function move(step, my) {
    return new Promise(function (res) {
      var p1 = pathEl(step.d), p2 = step.par ? pathEl(step.par) : null;
      var L1 = p1.getTotalLength(), L2 = p2 ? p2.getTotalLength() : 0;
      var dur = Math.max(L1, L2) / SPEED * 1000, t0 = null;
      dot2.setAttribute("opacity", p2 ? 1 : 0);
      function tick(t) {
        if (my !== token) return res(false);
        if (t0 === null) t0 = t;
        var f = Math.min(1, (t - t0) / dur);
        f = f < 0.5 ? 2 * f * f * 0.35 + f * 0.65 : 1 - (2 * (1 - f) * (1 - f) * 0.35 + (1 - f) * 0.65); // gentle ease
        place(dot, p1, L1 * f); if (p2) place(dot2, p2, L2 * f);
        if ((t - t0) < dur) requestAnimationFrame(tick); else { place(dot, p1, L1); if (p2) place(dot2, p2, L2); res(true); }
      }
      requestAnimationFrame(tick);
    });
  }
  function showCaption(i) {
    cap.setAttribute("opacity", 0);
    setTimeout(function () {
      document.getElementById("cap-k").textContent = RUNS[i].k;
      for (var j = 0; j < 3; j++) document.getElementById("cap-" + (j + 1)).textContent = RUNS[i].lines[j];
      cap.setAttribute("opacity", 1);
      pips.forEach(function (c, j) { c.classList.toggle("on", j === i); });
    }, 300);
  }

  async function playRun(i, my) {
    var run = RUNS[i];
    showCaption(i); setState(false); clearNodes();
    dot.setAttribute("opacity", 1);
    place(dot, pathEl("M94 300H118"), 0);
    setNode("leader", true); await wait(700, my); if (my !== token) return false;
    for (var s = 0; s < run.steps.length; s++) {
      var st = run.steps[s];
      if (st.hit) setNode("leader", false);
      if (!(await move(st, my))) return false;
      if (st.merge) dot2.setAttribute("opacity", 0);
      if (st.a) setState(true);
      if (st.hit) {
        clearNodes(); setNode(st.hit, true); if (st.hit2) setNode(st.hit2, true);
        if (!(await wait(st.dwell, my))) return false;
        if (s < run.steps.length - 1) { setNode(st.hit, false); if (st.hit2) setNode(st.hit2, false); }
      } else if (st.dwell && !(await wait(st.dwell, my))) return false;
    }
    return true;
  }
  async function play() {
    var my = ++token;
    dot.setAttribute("opacity", 0); dot2.setAttribute("opacity", 0); clearNodes();
    if (!(await wait(1800, my))) return;
    for (var i = 0; i < RUNS.length; i++) {
      if (!(await playRun(i, my))) return;
      if (i < RUNS.length - 1) { dot.setAttribute("opacity", 0); clearNodes(); if (!(await wait(900, my))) return; }
    }
  }
  function stop() { token++; dot.setAttribute("opacity", 0); dot2.setAttribute("opacity", 0); clearNodes(); }

  svg.addEventListener("click", play);
  document.addEventListener("keydown", function (e) { if (e.key === "r" || e.key === "R") play(); });
  window.IsaFlow = { play: play, stop: stop };
  if (reduce) { showCaption(0); } else { play(); }
})();
</script>
</body>
